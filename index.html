<!doctype html>
<html lang="en" class="h-full">
  <head>
    <script>
      try {
        const raw = localStorage.getItem('stroke:settings')
        const parsed = raw ? JSON.parse(raw) : null
        // Keep both lists in sync with src/lib/themes/registry.js. They were
        // already a theme behind: obsidian and clay were missing, so choosing
        // either meant booting into the OS default and repainting once the app
        // loaded.
        const valid = [
          'light', 'parchment', 'clay', 'claude-light', 'moss-light', 'orchid-light',
          'ice', 'github-light', 'light-high-contrast',
          'dark', 'obsidian', 'matte', 'claude', 'moss', 'orchid', 'graphite', 'midnight',
          'vitesse', 'slate', 'forest', 'mono', 'rose-pine', 'catppuccin',
          'solarized', 'dark-high-contrast', 'hotdog',
        ]
        const lightThemes = [
          'light', 'parchment', 'clay', 'claude-light', 'moss-light', 'orchid-light',
          'ice', 'github-light', 'light-high-contrast',
        ]
        let theme = parsed?.theme
        if (!valid.includes(theme)) {
          // No saved preference - follow the OS
          const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches !== false
          theme = prefersDark ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        const isLight = lightThemes.includes(theme)
        if (!isLight) document.documentElement.classList.add('dark')
        // The page boots at opacity 0 and stays there until the first finished
        // screen, so <html> must carry a painted background of its own - with
        // nothing but the transition below, a transparent root shows the
        // webview's white backdrop for the whole of startup. Inline, because the
        // theme stylesheet arrives with the bundle, well after the first paint.
        // These two are the base light/dark --background, and they match
        // LIGHT_SURFACE / DARK_SURFACE in src-tauri/src/lib.rs so the window,
        // the webview and the page all come up the same colour.
        document.documentElement.style.backgroundColor = isLight ? '#f7f7f7' : '#080808'
        let zoom = 1
        if (parsed?.zoom != null) zoom = Number(parsed.zoom)
        else if (parsed?.fontSize != null) zoom = Number(parsed.fontSize) / 14
        if (Number.isFinite(zoom) && zoom > 0) {
          const fontPx = Math.round(13 * zoom)
          const root = document.documentElement
          root.style.setProperty('--app-zoom', String(zoom))
          root.style.setProperty('--app-font-size', fontPx + 'px')
        }
      } catch (_) {
        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches !== false
        document.documentElement.dataset.theme = prefersDark ? 'dark' : 'light'
        if (prefersDark) document.documentElement.classList.add('dark')
        document.documentElement.style.backgroundColor = prefersDark ? '#080808' : '#f7f7f7'
      }
      ;(function () {
        var ua = navigator.userAgent || ''
        var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || ''
        var os = 'linux'
        if (/Win/i.test(platform) || /Windows/i.test(ua)) os = 'windows'
        else if (/Mac/i.test(platform) || /Macintosh|Mac OS/i.test(ua)) os = 'macos'
        document.documentElement.dataset.os = os
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/stroke_light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <title>DB Studio</title>
    <style>
      /* The page boots at opacity 0 and JS reveals it - but the window is shown
         from Rust on its own timer, so anything that stops the bundle before
         armRevealFailsafe() runs (a throw at module scope, an import that never
         resolves, a JavaScriptCore crash) leaves a painted black rectangle on
         screen with no way out but killing the app. That happened.

         This is the floor, and it needs no JS to work: after 8s the page shows
         itself. Longer than the 2.5s JS failsafe so a healthy boot always wins
         and this is never what reveals the app. */
      /* The app is hidden until the first finished screen marks the root.
         Nothing times this: revealApp() sets the attribute the moment it has
         something worth showing, and until then what is on screen is the mark
         below rather than an empty rectangle. Because the splash is what shows
         while the app is not ready, there is no failure that ends in a black
         window, and so nothing here needs a timer to rescue it. */
      #app { opacity: 0 }
      html[data-revealed] #app { opacity: 1 }
      html[data-revealed] #splash { display: none }

      /* The mark and the name, and nothing that moves. Startup has no progress
         to report, so there is nothing a spinner could say that the mark does
         not already say by being on screen. Inline and asset-light on purpose:
         it has to draw when the bundle is the thing that failed, so it depends
         on nothing the bundle provides. */
      #splash {
        position: fixed; inset: 0; z-index: 0;
        display: flex; align-items: center; justify-content: center; gap: 11px;
        color: #080808;
      }
      html.dark #splash { color: #f7f7f7 }
      #splash img { width: 32px; height: 32px; object-fit: contain; user-select: none; -webkit-user-drag: none }
      #splash span {
        font: 600 19px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: -0.015em;
      }
      /* The mark that stays visible against the surface behind it. The theme is
         only known to the head script, which has already set `.dark` by now. */
      #splash .mark-dark { display: none }
      html.dark #splash .mark-dark { display: block }
      html.dark #splash .mark-light { display: none }
    </style>
  </head>
  <body class="h-full" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="splash" aria-hidden="true">
      <img class="mark-dark" src="/stroke_white.png" alt="" />
      <img class="mark-light" src="/stroke_light.png" alt="" />
      <span>Stroke</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
