# Dev/test build — NOT a release.
#
# Builds the Windows NSIS setup exe from any dev-build/** branch and uploads it
# as a workflow artifact (no publishing, no signing, no version bump).
#
# Use it by pushing the state you want built:
#   git push origin <commit-ish>:refs/heads/dev-build/my-test
# or from the Actions tab via "Run workflow" on any branch.

name: Dev Build (Windows)

on:
  push:
    branches:
      - 'dev-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    # Pinned to windows-2022 for the same reason as release.yml: the VS 2026
    # preview image on windows-latest fails to compile libduckdb-sys.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # NSIS bundle only — skips the WiX/MSI build to keep dev iterations fast.
      - name: Build
        run: npx tauri build --bundles nsis

      - name: Upload setup exe
        uses: actions/upload-artifact@v4
        with:
          name: stroke-windows-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
