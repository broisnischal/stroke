# Build Stroke for Linux, Windows, and macOS and publish to GitHub Releases.
#
# Create a release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Or run manually: Actions → Release → Run workflow

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match tauri.conf.json version, e.g. v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

# ── 1. Create the release before any build starts ────────────────────────────
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          SHA: ${{ github.sha }}
        run: |
          PRERELEASE=""
          [[ "$TAG" == *-* ]] && PRERELEASE="--prerelease"

          # Extract changelog for this version from CHANGELOG.md.
          # Grabs everything between the matching "## [X.Y.Z]" header and the next one.
          VERSION="${TAG#v}"
          CHANGELOG=$(node -e "
            const fs = require('fs')
            const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n')
            const header = '## [' + process.env.VERSION + ']'
            let inside = false
            const out = []
            for (const l of lines) {
              if (l.startsWith(header)) { inside = true; continue }
              if (inside && /^## \[/.test(l)) break
              if (inside) out.push(l)
            }
            process.stdout.write(out.join('\n').trim())
          " VERSION="$VERSION")

          cat > /tmp/notes.md << EOF
          ${CHANGELOG:-No changelog available for this release.}

          ---

          ### Install

          **macOS**
          - Apple Silicon: \`stroke_*_aarch64.dmg\`
          - Intel Mac: \`stroke_*_x64.dmg\`

          > **"damaged and can't be opened"?** Run once: \`xattr -cr /Applications/Stroke.app\`

          **Linux:** \`.deb\` · \`.rpm\` · \`.AppImage\`

          **Windows:** \`.exe\` NSIS setup (recommended) · \`.msi\`

          Built from \`${SHA}\`.
          EOF

          gh release create "$TAG" \
            --title "Stroke $TAG" \
            --target "$SHA" \
            --notes-file /tmp/notes.md \
            $PRERELEASE

# ── 2. Build on each platform ────────────────────────────────────────────────
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            args: ''
          - platform: windows-latest
            name: windows
            args: ''
          - platform: macos-latest
            name: macos-aarch64
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            name: macos-x64
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    name: build-${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - run: npm ci

      # ── macOS: ad-hoc signing only (signingIdentity "-" in tauri.conf.json).
      #    No Apple Developer cert / notarization. Users run `xattr -cr` once.
      #    See install notes in the create-release step.

      # ── Windows: import PFX into cert store, patch config with thumbprint ─────
      - name: Import Windows signing certificate
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "WINDOWS_CERTIFICATE not set — skipping Windows signing"
            exit 0
          }
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath  = Join-Path $env:TEMP "signing.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          $secPwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PWD -Force -AsPlainText
          $cert   = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $secPwd
          Remove-Item $certPath -Force

          $env:WIN_CERT_THUMB = $cert.Thumbprint
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            cfg.bundle.windows.certificateThumbprint = process.env.WIN_CERT_THUMB;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2));
            console.log('Certificate thumbprint set:', process.env.WIN_CERT_THUMB);
          "

      - name: Build
        run: npx tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: ${{ matrix.name == 'linux' && '1' || '' }}
          # macOS: ad-hoc signed only — no APPLE_CERTIFICATE, so Tauri skips the
          # PKCS12 import and notarization. Re-add the Apple secrets here to
          # restore full signing once a valid cert + password are available.

      # ── macOS aarch64 ───────────────────────────────────────────────────────
      - name: Upload macOS aarch64 artifacts
        if: matrix.name == 'macos-aarch64'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"

          pushd "$DIR/macos"
          tar czf "Stroke.app.tar.gz" "Stroke.app"
          popd
          npx tauri signer sign "$DIR/macos/Stroke.app.tar.gz"

          cp "$DIR/macos/Stroke.app.tar.gz"     stroke_aarch64.app.tar.gz
          cp "$DIR/macos/Stroke.app.tar.gz.sig" updater.sig

          gh release upload "$TAG" \
            "$DIR/dmg/stroke_${VERSION}_aarch64.dmg" \
            stroke_aarch64.app.tar.gz \
            --clobber

      # ── macOS x64 ───────────────────────────────────────────────────────────
      - name: Upload macOS x64 artifacts
        if: matrix.name == 'macos-x64'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DIR="src-tauri/target/x86_64-apple-darwin/release/bundle"

          pushd "$DIR/macos"
          tar czf "Stroke.app.tar.gz" "Stroke.app"
          popd
          npx tauri signer sign "$DIR/macos/Stroke.app.tar.gz"

          cp "$DIR/macos/Stroke.app.tar.gz"     stroke_x64.app.tar.gz
          cp "$DIR/macos/Stroke.app.tar.gz.sig" updater.sig

          gh release upload "$TAG" \
            "$DIR/dmg/stroke_${VERSION}_x64.dmg" \
            stroke_x64.app.tar.gz \
            --clobber

      # ── Linux ───────────────────────────────────────────────────────────────
      - name: Upload Linux artifacts
        if: matrix.name == 'linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DIR="src-tauri/target/release/bundle"

          pushd "$DIR/appimage"
          tar czf "stroke_${VERSION}_amd64.AppImage.tar.gz" "stroke_${VERSION}_amd64.AppImage"
          popd
          npx tauri signer sign "$DIR/appimage/stroke_${VERSION}_amd64.AppImage.tar.gz"

          cp "$DIR/appimage/stroke_${VERSION}_amd64.AppImage.tar.gz"     stroke_amd64.AppImage.tar.gz
          cp "$DIR/appimage/stroke_${VERSION}_amd64.AppImage.tar.gz.sig" updater.sig

          gh release upload "$TAG" \
            "$DIR/deb/stroke_${VERSION}_amd64.deb" \
            "$DIR/rpm/stroke-${VERSION}-1.x86_64.rpm" \
            "$DIR/appimage/stroke_${VERSION}_amd64.AppImage" \
            stroke_amd64.AppImage.tar.gz \
            --clobber

      # ── Windows ─────────────────────────────────────────────────────────────
      - name: Upload Windows artifacts
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dir     = "src-tauri/target/release/bundle"

          $exe = "$dir/nsis/stroke_${version}_x64-setup.exe"
          $zip = "$dir/nsis/stroke_${version}_x64-setup.nsis.zip"

          # Use NoCompression (Store = method 0) — universally supported by every
          # ZIP implementation including Tauri's zip crate.
          # Compress-Archive → Deflate64 (method 9) ❌ not supported by Tauri
          # CompressionLevel::Optimal on newer .NET → may vary ❌ unreliable
          # CompressionLevel::NoCompression → Store (method 0) ✅ always works
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $stream = [System.IO.Compression.ZipFile]::Open($zip, 'Create')
          [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
            $stream,
            $exe,
            [System.IO.Path]::GetFileName($exe),
            [System.IO.Compression.CompressionLevel]::NoCompression
          ) | Out-Null
          $stream.Dispose()

          # Verify the ZIP uses Store (method 0) — fail fast if something is wrong
          $verify = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $entry  = $verify.Entries[0]
          $method = [int]$entry.CompressionMethod
          $verify.Dispose()
          Write-Host "ZIP entry: $($entry.Name)  compression method: $method"
          if ($method -ne 0) {
            Write-Error "Wrong compression method $method — expected 0 (Store/NoCompression)"
            exit 1
          }
          Write-Host "✅ Compression method verified: Store (0) — Tauri compatible"

          npx tauri signer sign $zip

          Copy-Item $zip       "stroke_x64-setup.nsis.zip"
          Copy-Item "$zip.sig" "updater.sig"

          gh release upload "$env:TAG" `
            "$dir/msi/stroke_${version}_x64_en-US.msi" `
            "$dir/nsis/stroke_${version}_x64-setup.exe" `
            "stroke_x64-setup.nsis.zip" `
            --clobber

      - name: Save updater sig as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.name }}
          path: updater.sig
          if-no-files-found: warn

# ── 3. Combine signatures into latest.json ───────────────────────────────────
  publish-updater-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all sig artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sig-*

      - name: Generate and upload latest.json
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          export VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          export BASE="https://github.com/broisnischal/stroke/releases/download/${TAG}"

          node - <<'JSEOF'
          const fs = require('fs')
          const { VERSION, BASE } = process.env

          const read = (f) => { try { return fs.readFileSync(f, 'utf8').trim() } catch { return '' } }

          // Extract this version's changelog section from CHANGELOG.md
          function extractChangelog(version) {
            try {
              const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n')
              const header = `## [${version}]`
              let inside = false
              const out = []
              for (const l of lines) {
                if (l.startsWith(header)) { inside = true; continue }
                if (inside && /^## \[/.test(l)) break
                if (inside) out.push(l)
              }
              return out.join('\n').trim()
            } catch { return '' }
          }

          const platforms = {}
          const add = (key, sigFile, url) => {
            const sig = read(sigFile)
            if (sig) platforms[key] = { signature: sig, url }
            else console.warn(`⚠  no sig at ${sigFile} — skipping ${key}`)
          }

          add('darwin-aarch64', 'sig-macos-aarch64/updater.sig', `${BASE}/stroke_aarch64.app.tar.gz`)
          add('darwin-x86_64',  'sig-macos-x64/updater.sig',     `${BASE}/stroke_x64.app.tar.gz`)
          add('linux-x86_64',   'sig-linux/updater.sig',         `${BASE}/stroke_amd64.AppImage.tar.gz`)
          add('windows-x86_64', 'sig-windows/updater.sig',       `${BASE}/stroke_x64-setup.nsis.zip`)

          const notes = extractChangelog(VERSION) || `See https://github.com/broisnischal/stroke/releases/tag/v${VERSION}`

          const out = {
            version: VERSION,
            notes,
            pub_date: new Date().toISOString(),
            platforms,
          }

          fs.writeFileSync('latest.json', JSON.stringify(out, null, 2))
          console.log(JSON.stringify(out, null, 2))

          if (!Object.keys(platforms).length) { console.error('ERROR: no signatures found'); process.exit(1) }
          JSEOF

      - name: Upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: gh release upload "$TAG" latest.json --clobber
