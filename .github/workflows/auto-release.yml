# Triggered when a PR is merged into master.
#
# Label the PR with one of:
#   release:patch  →  0.0.x  (bug fixes)
#   release:minor  →  0.x.0  (new features, backwards-compatible)
#   release:major  →  x.0.0  (breaking changes)
#
# The workflow will:
#   1. Bump the version in tauri.conf.json + package.json
#   2. Commit the bump directly to master
#   3. Push a vX.Y.Z tag → triggers release.yml to build and publish

name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  auto-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so the version-bump commit can be pushed
          fetch-depth: 0
          # Use the default GITHUB_TOKEN — requires "contents: write" above.
          # If master has branch protection that blocks bot pushes, replace
          # with a PAT stored in secrets.RELEASE_TOKEN.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 1. Determine bump type from PR labels ─────────────────────────────
      - name: Resolve bump type
        id: bump
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "PR labels: $LABELS"

          if   echo "$LABELS" | grep -q '"release:major"'; then echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"release:minor"'; then echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"release:patch"'; then echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=skip" >> "$GITHUB_OUTPUT"
            echo "No release:* label found — skipping release."
          fi

      # ── 2. Bump version in tauri.conf.json + package.json ─────────────────
      - name: Bump version
        if: steps.bump.outputs.type != 'skip'
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          node - <<'EOF'
          const fs   = require('fs')
          const bump = process.env.BUMP_TYPE

          // ── tauri.conf.json ──────────────────────────────────────────────
          const cfgPath = 'src-tauri/tauri.conf.json'
          const cfg     = JSON.parse(fs.readFileSync(cfgPath, 'utf8'))
          const [maj, min, pat] = cfg.version.split('.').map(Number)

          const next =
            bump === 'major' ? `${maj + 1}.0.0` :
            bump === 'minor' ? `${maj}.${min + 1}.0` :
                               `${maj}.${min}.${pat + 1}`

          cfg.version = next
          fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2) + '\n')
          console.log(`tauri.conf.json: ${cfg.version.split('.').slice(0,-1).join('.')+'.'+pat} → ${next}`)

          // ── package.json ─────────────────────────────────────────────────
          const pkgPath = 'package.json'
          const pkg     = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version   = next
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
          console.log(`package.json: bumped to ${next}`)

          // ── Expose to subsequent steps ───────────────────────────────────
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `new_version=${next}\n`)
          EOF

      # ── 3. Commit bump, tag, and push ─────────────────────────────────────
      - name: Commit and tag
        if: steps.bump.outputs.type != 'skip'
        env:
          NEW_TAG: v${{ steps.version.outputs.new_version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src-tauri/tauri.conf.json package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"

          git tag "$NEW_TAG"

          # Push commit + tag together; the tag push triggers release.yml
          git push origin master
          git push origin "$NEW_TAG"

          echo "✅ Tagged $NEW_TAG — release.yml will now build and publish."
