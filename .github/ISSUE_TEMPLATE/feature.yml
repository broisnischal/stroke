name: Feature request
description: Suggest something Stroke should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The task, not the feature. Knowing what you are actually trying to
        accomplish often turns up a better answer than the one being asked for.
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: How do you do it today
      description: In Stroke, or in whatever tool you reach for instead.
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional — the problem is the important part.
